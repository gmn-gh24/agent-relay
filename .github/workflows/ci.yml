# The static part of the test gate of agent-relay on every push to main, every pull request, and on demand.
# Linux runs the static checks (PSScriptAnalyzer included) and the pane's checks on every commit.
# The Pester files (PowerShell 7 and Windows PowerShell 5.1) do not run here: they need Windows, and Windows
# minutes are the expensive ones. The owner runs them on a dev machine before a commit:
# tests\Invoke-AllTests.ps1 (the full gate) or -Editions ps7 / ps5.
# There is no sh tool and no sh test: sh is postponed by the owner. The eval cases never run here: each run is
# a paid session on the owner's account.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Static checks of the gate
        shell: pwsh
        run: ./tests/Invoke-AllTests.ps1 -StaticOnly

  pane:
    name: Pane (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Test the pane
        run: claude plugin test .
